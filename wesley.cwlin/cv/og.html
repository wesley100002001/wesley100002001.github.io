<!DOCTYPE html>
<html lang="zh-TW">

<!-- 分享預覽圖模板：用 Chrome 以 1200×630 截圖成 og-image.jpg -->

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>林家偉 CV 分享圖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 500px 1fr;
            background: #faf8f6;
            color: #2a2a2a;
            font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
        }

        img {
            width: 100%;
            height: 630px;
            object-fit: cover;
            object-position: center 30%;
            display: block;
        }

        .text {
            padding: 0 72px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 88px;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.1;
        }

        h1 small {
            font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 0.06em;
            color: #8a8a8a;
            margin-left: 12px;
        }

        .kind {
            font-size: 34px;
            letter-spacing: 0.2em;
            margin-top: 14px;
        }

        .award {
            margin-top: 44px;
            padding-left: 22px;
            border-left: 6px solid #ce4b4d;
            color: #ce4b4d;
            font-size: 30px;
            font-weight: 500;
            line-height: 1.45;
        }

        .tags {
            margin-top: 30px;
            font-size: 26px;
            letter-spacing: 0.15em;
            color: #555;
        }
    </style>
</head>

<body>
    <img src="images/cover.jpg" alt="">
    <div class="text">
        <h1>林家偉<small>Wesley Lin</small></h1>
        <div class="kind">演員履歷 CV</div>
        <div class="award">2025 臺北藝穗節<br>藝穗精選獎</div>
        <div class="tags">台語・音樂劇・操偶</div>
    </div>
</body>

</html>
