    <style>
        @page {
            size: 1280px 720px;
            margin: 0;
        }

        :root {
            --primary: #ce4b4d;
            --ink: #2a2a2a;
            --muted: #8a8a8a;
            --line: #ebe6e2;
            --paper: #faf8f6;
            --serif: 'Noto Serif TC', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
            background: #d9d6d3;
            color: var(--ink);
            line-height: 1.6;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .slide {
            position: relative;
            width: 1280px;
            height: 720px;
            margin: 24px auto;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .slide.overflow {
            outline: 4px solid var(--primary);
        }

        .photo {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            object-fit: cover;
            object-position: center 25%;
            display: block;
        }

        .eyebrow {
            font-size: 13px;
            letter-spacing: 0.3em;
            color: var(--primary);
            font-weight: 500;
        }

        .slide-title {
            font-family: var(--serif);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.3;
        }

        .slide-subtitle {
            color: var(--muted);
            font-size: 16px;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 12px;
            border-radius: 3px;
            padding: 1px 8px;
            margin-left: 6px;
            vertical-align: 2px;
            font-weight: 500;
        }

        /* ---------- 封面 ---------- */
        .cover,
        .split,
        .contact {
            display: grid;
            grid-template-rows: 100%;
        }

        .cover {
            grid-template-columns: minmax(0, 1fr) 520px;
        }

        .cover-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: var(--paper);
        }

        .cover-name {
            writing-mode: vertical-rl;
            font-family: var(--serif);
            font-size: 120px;
            font-weight: 700;
            letter-spacing: 0.2em;
            line-height: 1;
            border-right: 6px solid var(--primary);
            padding-right: 18px;
        }

        .cover-en {
            font-size: 22px;
            letter-spacing: 0.35em;
            font-weight: 300;
        }

        .cover-award {
            color: var(--primary);
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.12em;
            border-top: 1px solid var(--primary);
            border-bottom: 1px solid var(--primary);
            padding: 4px 12px;
        }

        /* ---------- 基本資料、自我介紹 ---------- */
        .split {
            grid-template-columns: 500px minmax(0, 1fr);
        }

        .split-body {
            padding: 64px 72px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .block+.block {
            margin-top: 28px;
        }

        .block h2 {
            font-family: var(--serif);
            font-size: 22px;
            letter-spacing: 0.1em;
            padding-bottom: 6px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--ink);
            display: inline-block;
        }

        .kv {
            display: grid;
            grid-template-columns: 64px 1fr;
            font-size: 17px;
            line-height: 1.85;
        }

        .kv dt {
            color: var(--muted);
        }

        .plain {
            font-size: 17px;
            line-height: 1.85;
            list-style: none;
        }

        .intro-text p {
            font-size: 22px;
            line-height: 1.9;
            font-weight: 300;
        }

        .intro-text p+p {
            margin-top: 22px;
        }

        .intro-text p:first-child {
            font-weight: 500;
        }

        /* ---------- 作品列表：照片在一側，列表那側漸層融成紙色（.dark 壓黑） ---------- */
        .credits {
            background: var(--paper);
            --fade: var(--paper);
            --fade-clear: rgba(250, 248, 246, 0);
        }

        .credits.dark {
            --fade: rgba(18, 18, 18, 0.94);
            --fade-clear: rgba(18, 18, 18, 0.1);
            color: #f2efec;
            /* 照片沒蓋到的地方用同一個黑，避免半透明壓在白底上變淡 */
            background: rgb(18, 18, 18);
        }

        .credits-bg {
            position: absolute;
            inset: 0;
        }

        .credits-bg .photo {
            position: absolute;
            width: auto;
            max-width: none;
        }

        .photo-right .credits-bg .photo {
            right: 0;
        }

        /* photoShift：照片往左移幾 px，讓人臉離開漸層 */
        .photo-left .credits-bg .photo {
            left: var(--shift, 0);
        }

        .credits-bg::after {
            content: "";
            position: absolute;
            inset: 0;
        }

        .photo-right .credits-bg::after {
            background: linear-gradient(to right, var(--fade) 58%, var(--fade-clear) 72%);
        }

        .photo-left .credits-bg::after {
            background: linear-gradient(to left, var(--fade) 64%, var(--fade-clear) 78%);
        }

        .credits-card {
            position: absolute;
            top: 0;
            bottom: 0;
            height: fit-content;
            margin: auto 0;
            width: 780px;
            max-height: 640px;
            padding: 30px 0 22px;
            display: flex;
            flex-direction: column;
        }

        .photo-right .credits-card {
            left: 64px;
        }

        .photo-left .credits-card {
            right: 32px;
            width: 760px;
        }

        .dark .credits-head {
            border-color: #f2efec;
        }

        .dark .row {
            border-color: rgba(255, 255, 255, 0.14);
        }

        .dark .row .y {
            color: #9a9590;
        }

        .dark .row .r {
            color: #cfcac5;
        }

        .dark .group-label,
        .dark .eyebrow {
            color: #e8797b;
        }

        .credits-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 8px;
            margin-bottom: 14px;
        }

        .credits-head .slide-title {
            font-size: 28px;
        }

        .credits-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 36px;
            align-items: start;
        }

        .group {
            margin-bottom: 12px;
        }

        .group-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.15em;
            margin-bottom: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            gap: 10px;
            font-size: 14px;
            line-height: 1.5;
            padding: 4px 0;
            border-bottom: 1px solid var(--line);
        }

        .row .y {
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .row .r {
            color: #555;
            text-align: right;
            max-width: 200px;
        }

        /* ---------- 照片頁 ---------- */
        .gallery {
            display: flex;
            flex-direction: column;
            padding: 40px 48px 44px;
            background: var(--paper);
        }

        .gallery-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 32px;
            margin-bottom: 20px;
        }

        .gallery-credits {
            list-style: none;
            font-size: 16px;
            line-height: 1.7;
            text-align: right;
        }

        .gallery-credits span {
            color: var(--muted);
            margin-right: 10px;
        }

        .grid {
            flex: 1;
            min-height: 0;
            display: grid;
            gap: 12px;
        }

        .grid.even {
            grid-auto-flow: column;
            grid-auto-columns: 1fr;
        }

        .grid.feature {
            grid-template-columns: 1.15fr 1fr;
        }

        .grid.feature .rest {
            display: grid;
            gap: 12px;
            min-height: 0;
        }

        .shot {
            position: relative;
            min-height: 0;
            overflow: hidden;
            background: white;
        }

        .shot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            display: block;
        }

        .shot.contain img {
            object-fit: contain;
        }

        .shot figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 14px 10px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.05em;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
        }

        /* ---------- 聯絡 ---------- */
        .contact {
            grid-template-columns: minmax(0, 1fr) 520px;
        }

        .contact-body {
            padding: 64px 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--paper);
        }

        .thanks {
            font-family: var(--serif);
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .contact-list {
            list-style: none;
            font-size: 18px;
            line-height: 2;
        }

        .contact-list span {
            display: inline-block;
            width: 92px;
            color: var(--muted);
            font-size: 15px;
        }

        .qr {
            display: flex;
            gap: 24px;
            margin-top: 32px;
        }

        .qr figure {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .qr img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            display: block;
            background: white;
        }

        /* ---------- 下載按鈕 ---------- */
        .download-btn {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        .download-btn:hover {
            filter: brightness(1.08);
        }

        /* ---------- 手機版面（只影響螢幕，列印仍是 16:9） ---------- */
        @media screen and (max-width: 760px) {
            body {
                background: var(--paper);
            }

            .slide {
                width: auto;
                height: auto;
                margin: 0 0 12px;
                box-shadow: none;
            }

            .cover,
            .split,
            .contact {
                display: flex;
                flex-direction: column;
            }

            .cover .photo,
            .split .photo,
            .contact .photo {
                height: auto;
                aspect-ratio: 4 / 5;
            }

            .contact .photo {
                order: -1;
                aspect-ratio: 1 / 1;
            }

            .cover-side {
                padding: 28px 16px 36px;
                gap: 14px;
            }

            .cover-name {
                writing-mode: horizontal-tb;
                font-size: 56px;
                border-right: 0;
                padding-right: 0;
                border-bottom: 4px solid var(--primary);
                padding-bottom: 10px;
            }

            .cover-en {
                font-size: 16px;
            }

            .split-body,
            .contact-body {
                padding: 28px 20px 32px;
            }

            .kv,
            .plain {
                font-size: 16px;
            }

            .intro-text p {
                font-size: 18px;
            }

            .credits-bg {
                position: relative;
                height: 180px;
            }

            .credits-bg .photo {
                position: static;
                width: 100%;
            }

            .credits-bg::after {
                display: none;
            }

            .credits-card {
                position: static;
                width: auto;
                max-height: none;
                margin: 0;
                padding: 22px 20px 12px;
                background: var(--paper);
            }

            .dark .credits-card {
                background: #1c1c1c;
            }

            .credits-head .slide-title,
            .slide-title {
                font-size: 24px;
            }

            .credits-cols {
                grid-template-columns: 1fr;
            }

            .row {
                font-size: 14px;
                grid-template-columns: 40px 1fr auto;
            }

            .row .r {
                max-width: 120px;
            }

            .gallery {
                padding: 24px 16px 20px;
            }

            .gallery-head {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                margin-bottom: 14px;
            }

            .gallery-credits {
                text-align: left;
                font-size: 14px;
            }

            .grid.feature,
            .grid.even {
                grid-template-columns: 1fr 1fr;
                grid-auto-flow: row;
                gap: 8px;
            }

            .grid.feature .rest {
                display: contents;
            }

            .grid>.shot:first-child {
                grid-column: 1 / -1;
                aspect-ratio: 4 / 3;
            }

            .shot {
                aspect-ratio: 3 / 4;
            }

            /* 落單的最後一張改成整列，照原比例顯示，避免橫的截圖被裁成直的 */
            .grid.even>.shot:last-child:nth-child(even),
            .grid.feature .rest>.shot:last-child:nth-child(odd) {
                grid-column: 1 / -1;
                aspect-ratio: auto;
            }

            .grid.even>.shot:last-child:nth-child(even) img,
            .grid.feature .rest>.shot:last-child:nth-child(odd) img {
                height: auto;
                max-height: 80vh;
            }

            .contact-list {
                font-size: 15px;
            }

            .contact-list span {
                width: 76px;
                font-size: 13px;
            }

            .download-btn {
                right: 16px;
                bottom: 16px;
                padding: 10px 18px;
            }
        }

        @media print {
            body {
                background: white;
            }

            .download-btn {
                display: none;
            }

            .slide {
                margin: 0;
                box-shadow: none;
                outline: 0 !important;
                break-after: page;
            }

            .slide:last-child {
                break-after: auto;
            }
        }
    </style>
</head>

<body>
    <main id="deck"></main>

    <a class="download-btn" href="wesley-lin-cv.pdf" download="林家偉 演員履歷 CV.pdf">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        下載 PDF
    </a>

    <script type="module">
        import credits from '../config/credits.js';
        import cvDeck from '../config/cv-deck.js';

        const IMG = 'images/';
        const byId = new Map(
            Object.values(credits).filter(Array.isArray).flat().filter((c) => c.id).map((c) => [c.id, c])
        );
        const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        function credit(id) {
            const c = byId.get(id);
            if (!c) console.warn(`credits.js 找不到 id：${id}`);
            return c;
        }

        // 列表上的劇名：英文或已含書名號的維持原樣，其他加《》
        const workTitle = (t) => (/[《（(]/.test(t) || /^[A-Za-z]/.test(t) ? t : `《${t}》`);

        function cover(s) {
            return `
                <section class="slide cover">
                    <img class="photo" src="${IMG}${s.photo}" alt="">
                    <div class="cover-side">
                        <div class="cover-name">${esc(cvDeck.name)}</div>
                        <div class="cover-en">${esc(cvDeck.nameEn)}</div>
                        <div class="cover-award">${esc(cvDeck.headline)}</div>
                    </div>
                </section>`;
        }

        function profile(s) {
            return `
                <section class="slide split">
                    <img class="photo" src="${IMG}${s.photo}" alt="">
                    <div class="split-body">
                        <div class="block">
                            <h2>基本資料</h2>
                            <dl class="kv">${cvDeck.profile.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
                        </div>
                        <div class="block">
                            <h2>語言能力</h2>
                            <ul class="plain">${cvDeck.languages.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
                        </div>
                        <div class="block">
                            <h2>個人特色</h2>
                            <p class="plain">${esc(cvDeck.traits)}</p>
                        </div>
                    </div>
                </section>`;
        }

        function intro(s) {
            return `
                <section class="slide split">
                    <img class="photo" src="${IMG}${s.photo}" alt="">
                    <div class="split-body intro-text">
                        ${cvDeck.intro.map((p) => `<p>${esc(p)}</p>`).join('')}
                    </div>
                </section>`;
        }

        function creditRow(c, showCompany, plain) {
            const right = showCompany ? c.company : c.role;
            return `
                <div class="row">
                    <span class="y">${esc(c.year)}</span>
                    <span>${esc(plain ? c.title : workTitle(c.title))}${c.award ? '<span class="badge">藝穗精選獎</span>' : ''}</span>
                    <span class="r">${esc(right)}</span>
                </div>`;
        }

        // 依行數把分類平均分到左右兩欄（分類標題算一行）
        function splitColumns(groups) {
            const total = groups.reduce((n, g) => n + g.ids.length + 1, 0);
            const left = [];
            let count = 0;
            for (const g of groups) {
                if (left.length && count + (g.ids.length + 1) / 2 > total / 2) break;
                left.push(g);
                count += g.ids.length + 1;
            }
            return [left, groups.slice(left.length)];
        }

        function creditsSlide(s) {
            return `
                <section class="slide credits ${s.cardSide === 'left' ? 'photo-right' : 'photo-left'} ${s.tone === 'dark' ? 'dark' : ''}">
                    <div class="credits-bg" style="--shift: ${-(s.photoShift || 0)}px"><img class="photo" src="${IMG}${s.background}" alt=""></div>
                    <div class="credits-card">
                        <div class="credits-head">
                            <h2 class="slide-title">${esc(s.title)}</h2>
                            <span class="eyebrow">${esc(s.roleLabel)}</span>
                        </div>
                        <div class="credits-cols">
                            ${splitColumns(s.groups).map((col) => `<div>${col.map((g) => `
                                <div class="group">
                                    <div class="group-label">${esc(g.label)}</div>
                                    ${g.ids.map(credit).filter(Boolean).map((c) => creditRow(c, s.showCompany, g.plain)).join('')}
                                </div>`).join('')}</div>`).join('')}
                        </div>
                    </div>
                </section>`;
        }

        function shot(p) {
            return `
                <figure class="shot ${p.fit === 'contain' ? 'contain' : ''}">
                    <img src="${IMG}${p.src}" alt="">
                    ${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ''}
                </figure>`;
        }

        // 主照片之外的照片排法：1 張單獨、2 張上下、3 張並排、4 張以上兩欄
        function restLayout(n) {
            if (n <= 1) return 'grid-template-rows: 1fr;';
            if (n === 2) return 'grid-template-rows: 1fr 1fr;';
            if (n === 3) return 'grid-template-columns: repeat(3, 1fr);';
            return `grid-template-columns: 1fr 1fr; grid-template-rows: repeat(${Math.ceil(n / 2)}, 1fr);`;
        }

        function gallery(s) {
            const list = (s.creditIds || []).map(credit).filter(Boolean);
            const [first, ...rest] = s.photos;
            const grid = s.layout === 'feature' && rest.length
                ? `<div class="grid feature">${shot(first)}<div class="rest" style="${restLayout(rest.length)}">${rest.map(shot).join('')}</div></div>`
                : `<div class="grid even">${s.photos.map(shot).join('')}</div>`;

            return `
                <section class="slide gallery">
                    <div class="gallery-head">
                        <div>
                            <h2 class="slide-title">${esc(s.title)}</h2>
                            ${s.subtitle ? `<p class="slide-subtitle">${esc(s.subtitle)}</p>` : ''}
                        </div>
                        ${list.length ? `<ul class="gallery-credits">${list.map((c) => `<li><span>${esc(c.year)}</span>${esc(c.title)}</li>`).join('')}</ul>` : ''}
                    </div>
                    ${grid}
                </section>`;
        }

        function contact(s) {
            const items = [
                ['Email', cvDeck.email],
                ['Phone', cvDeck.phone],
                ['LINE', cvDeck.line],
                ['Instagram', cvDeck.instagram],
                ['Website', cvDeck.website]
            ].filter(([, v]) => v);
            return `
                <section class="slide contact">
                    <div class="contact-body">
                        <p class="thanks">謝謝您閱讀完畢，<br>期待有機會一起合作！</p>
                        <p class="eyebrow" style="margin-bottom:8px">CONTACT</p>
                        <ul class="contact-list">${items.map(([k, v]) => `<li><span>${k}</span>${esc(v)}</li>`).join('')}</ul>
                        <div class="qr">
                            ${s.qr.map((q) => `<figure><img src="${IMG}${q.src}" alt="${esc(q.label)} QR code"><figcaption>${esc(q.label)}</figcaption></figure>`).join('')}
                        </div>
                    </div>
                    <img class="photo" src="${IMG}${s.photo}" alt="">
                </section>`;
        }

        const RENDER = { cover, profile, intro, credits: creditsSlide, gallery, contact };
        document.getElementById('deck').innerHTML = cvDeck.slides.map((s) => RENDER[s.type](s)).join('');

        function checkOverflow() {
            document.querySelectorAll('.slide, .credits-card').forEach((el) => {
                const slide = el.closest('.slide');
                if (el.scrollHeight > el.clientHeight + 1) slide.classList.add('overflow');
            });
        }
        // 手機版面高度不固定，只在桌面寬度檢查
        if (matchMedia('(min-width: 761px)').matches) document.fonts.ready.then(checkOverflow);
    </script>
</body>

</html>
