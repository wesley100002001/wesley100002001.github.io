# 部署 GitHub Pages，並在部署前用 Chrome 把 CV 頁印成 PDF（PDF 不進 git）
name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只發佈網站需要的檔案，.claude、CLAUDE.md、package.json 等不公開
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html sitemap.xml cv wesley.cwlin _site/

      - name: Print CV to PDF and modal card to JPG
        run: |
          cd _site
          python3 -m http.server 8000 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 0.5; done
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=15000 \
            --print-to-pdf=wesley.cwlin/cv/wesley-lin-cv.pdf \
            http://localhost:8000/wesley.cwlin/
          # modal card：A4 橫式 1754×1240 用 2 倍截圖，副檔名 .jpg 就直接存 JPG
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=2 --window-size=1754,1240 \
            --virtual-time-budget=15000 \
            --screenshot=wesley.cwlin/cv/wesley-lin-modal-card.jpg \
            "http://localhost:8000/wesley.cwlin/cv/modal-card.html?shot"
          kill %1

      - name: Check PDF and modal card
        run: |
          pdf=_site/wesley.cwlin/cv/wesley-lin-cv.pdf
          test -s "$pdf"
          size=$(stat -c %s "$pdf")
          echo "PDF size: $size bytes"
          test "$size" -lt 10485760 || { echo "PDF 超過 10 MB"; exit 1; }
          card=_site/wesley.cwlin/cv/wesley-lin-modal-card.jpg
          test -s "$card"
          size=$(stat -c %s "$card")
          echo "Modal card size: $size bytes"
          test "$size" -lt 5242880 || { echo "Modal card 超過 5 MB"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
